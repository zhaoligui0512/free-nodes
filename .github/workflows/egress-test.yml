name: Egress Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show egress IP
        run: |
          echo "=== Runner 出口位置 ==="
          curl -s "http://ip-api.com/json/?fields=country,countryCode,regionName,city,isp,query"
          echo ""

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Download Mihomo
        run: |
          curl -sL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.27/mihomo-linux-amd64-v1.19.27.gz" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo

      - name: Test CF nodes
        run: python3 cf-egress-test.py ./mihomo
