name: Round 2 Test

on:
  # 测试阶段：每小时10分跑第2轮
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Download Mihomo
        run: |
          curl -sL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.27/mihomo-linux-amd64-v1.19.27.gz" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Download GeoData
        run: |
          curl -sL "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb" -o country.mmdb
          curl -sL "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat" -o geosite.dat || true

      - name: Show cache before
        run: |
          echo "=== 缓存内容（测试前，应含第1轮结果）==="
          ls -la .cache/ 2>/dev/null || echo "[WARN] 无缓存文件！第1轮可能未成功commit"
          python3 -c 'import json,os; print("第1轮:", json.load(open(".cache/round_1.json"))["timestamp"]) if os.path.exists(".cache/round_1.json") else print("第1轮结果缺失")'

      - name: Run Round 2 Test
        run: |
          echo "=== 第2轮测试开始 ==="
          python3 collector.py --round 2
          echo "=== 第2轮测试完成 ==="

      - name: Show cache after
        run: |
          echo "=== 缓存内容（测试后）==="
          ls -la .cache/
          python3 -c 'import json,glob; [print(f, ":", json.load(open(f))["timestamp"]) for f in sorted(glob.glob(".cache/round_*.json"))]'

      - name: Commit cache to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .cache/
          git diff --staged --quiet || git commit -m "Round 2 test result $(date '+%Y-%m-%d %H:%M')"
          git push
