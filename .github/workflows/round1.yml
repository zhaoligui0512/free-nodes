name: Round 1 Test

on:
  # 测试阶段：每小时整点跑第1轮（间隔10分钟，20分钟完成全流程）
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Download Mihomo
        run: |
          curl -sL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.27/mihomo-linux-amd64-v1.19.27.gz" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Download GeoData
        run: |
          curl -sL "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb" -o country.mmdb
          curl -sL "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat" -o geosite.dat || true
          ls -lh country.mmdb

      - name: Show existing cache
        run: |
          echo "=== 已有缓存（来自之前轮次）==="
          ls -la .cache/ 2>/dev/null || echo "无缓存（首次运行）"

      - name: Run Round 1 Test
        run: |
          echo "=== 第1轮测试开始 ==="
          python3 collector.py --round 1
          echo "=== 第1轮测试完成 ==="

      - name: Show result
        run: |
          echo "=== 第1轮结果 ==="
          ls -la .cache/
          python3 -c 'import json; d=json.load(open(".cache/round_1.json")); print("时间:", d["timestamp"]); print("节点数:", len(d["results"])); print("存活:", sum(1 for r in d["results"] if r["delay"]>0))'

      - name: Commit cache to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .cache/
          if git diff --staged --quiet; then
            echo "无变更，跳过commit"
          else
            git commit -m "Round 1 test result $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main || echo "[WARN] rebase失败，继续尝试push"
            git push
          fi
